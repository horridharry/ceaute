<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta name="color-scheme" content="light only" />
    <meta name="supported-color-schemes" content="light only" />
    <title>Ceaute</title>
    <!--[if mso
      ]><style>
        body,
        table,
        td {
          font-family: Arial, Helvetica, sans-serif !important;
        }
      </style><!
    [endif]-->
    <style>
      @media (max-width: 620px) {
        .card {
          padding: 24px !important;
        }
        .h1 {
          font-size: 25px !important;
        }
        .time {
          font-size: 38px !important;
        }
        .code {
          font-size: 42px !important;
        }
        .btn {
          display: block !important;
          width: 100% !important;
          box-sizing: border-box;
        }
        .btn-cell {
          display: block !important;
          width: 100% !important;
          padding: 0 0 8px 0 !important;
        }
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f0eee9;
      -webkit-text-size-adjust: 100%;
    "
  >
    <div
      style="
        display: none;
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        color: transparent;
      "
    >
      Your Ceaute sign-in
      code&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;
    </div>
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background: #f0eee9"
    >
      <tr>
        <td align="center" style="padding: 24px 12px 40px">
          <table
            role="presentation"
            width="600"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="width: 600px; max-width: 100%"
          >
            <tr>
              <td
                style="
                  padding: 0 8px 14px;
                  font:
                    600 12px -apple-system,
                    BlinkMacSystemFont,
                    &quot;Segoe UI&quot;,
                    Roboto,
                    Helvetica,
                    Arial,
                    sans-serif;
                  letter-spacing: 0.2em;
                  text-transform: uppercase;
                  color: #8c2b52;
                "
              >
                ceaute
              </td>
            </tr>

            <tr>
              <td>
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="
                    background: #ffffff;
                    border: 1px solid #e4e2df;
                    border-radius: 14px;
                  "
                >
                  <tr>
                    <td class="card" style="padding: 36px">
                      <div
                        class="h1"
                        style="
                          font:
                            600 30px/1.14 -apple-system,
                            BlinkMacSystemFont,
                            &quot;Segoe UI&quot;,
                            Roboto,
                            Helvetica,
                            Arial,
                            sans-serif;
                          letter-spacing: -0.8px;
                          color: #0b0b0b;
                        "
                      >
                        Your code is
                      </div>
                      <div
                        class="code"
                        style="
                          padding-top: 14px;
                          font:
                            600 54px/1 -apple-system,
                            BlinkMacSystemFont,
                            &quot;Segoe UI&quot;,
                            Roboto,
                            Helvetica,
                            Arial,
                            sans-serif;
                          letter-spacing: 7px;
                          color: #0b0b0b;
                        "
                      >
                        {{ .Token }}
                      </div>
                      <div
                        style="
                          height: 1px;
                          line-height: 1px;
                          font-size: 0;
                          background: #e4e2df;
                          margin: 22px 0 20px;
                        "
                      >
                        &nbsp;
                      </div>
                      <div
                        style="
                          font:
                            400 14px/1.7 -apple-system,
                            BlinkMacSystemFont,
                            &quot;Segoe UI&quot;,
                            Roboto,
                            Helvetica,
                            Arial,
                            sans-serif;
                          color: #5c5c5c;
                        "
                      >
                        Type it into the tab you were on. Asking for another
                        code replaces this one.<br />If you did not ask to sign
                        in, ignore this — nothing happens without the code.
                      </div>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td
                style="
                  padding: 18px 8px 2px;
                  font:
                    400 12px/1.6 -apple-system,
                    BlinkMacSystemFont,
                    &quot;Segoe UI&quot;,
                    Roboto,
                    Helvetica,
                    Arial,
                    sans-serif;
                  color: #6e6e6e;
                "
              >
                Sent by Ceaute
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
